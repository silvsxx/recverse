name: Build Windows DLLs

on:
  push:
    branches: [master]
    paths:
      - 'recverse-windows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dlls:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build version.dll (proxy)
        working-directory: ${{ github.workspace }}\recverse-windows\version-proxy
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel

      - name: Build versemain.dll (main integration)
        working-directory: ${{ github.workspace }}\recverse-windows\versemain
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel

      - name: Verify DLLs exist
        shell: pwsh
        run: |
          ls -la ${{ github.workspace }}\recverse-windows\version-proxy\build\Release\version.dll
          ls -la ${{ github.workspace }}\recverse-windows\versemain\build\Release\versemain.dll

      - name: Upload DLLs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recverse-dlls
          path: |
            ${{ github.workspace }}\recverse-windows\version-proxy\build\Release\version.dll
            ${{ github.workspace }}\recverse-windows\versemain\build\Release\versemain.dll
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            recverse-windows/version-proxy/build/Release/version.dll
            recverse-windows/versemain/build/Release/versemain.dll
          draft: false
          prerelease: false